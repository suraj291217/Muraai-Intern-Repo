<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Store</title>

    <link rel="stylesheet" href="realworldproject.css" />
  </head>

  <body>
    <header class="navbar">
      <h1>MyStore</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <img
          src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=80"
          alt="Online shopping"
        />

        <h2>Welcome to MyStore</h2>

        <p>Find the best products at the best prices.</p>

        <button>Shop Now</button>
      </section>

      <section class="products">
        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80"
            alt="Laptop"
          />

          <h3>Laptop</h3>

          <p>Powerful laptop for developers.</p>

          <strong>₹60,000</strong>

          <button>Buy Now</button>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80"
            alt="Smartphone"
          />

          <h3>Smartphone</h3>

          <p>Latest smartphone with great camera.</p>

          <strong>₹25,000</strong>

          <button>Buy Now</button>
        </article>

        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
            alt="Wireless headphones"
          />

          <h3>Headphones</h3>

          <p>Wireless noise cancelling headphones.</p>

          <strong>₹3,000</strong>

          <button>Buy Now</button>
        </article>
      </section>
    </main>

    <footer>
      <p>© 2026 MyStore</p>
    </footer>
  </body>
</html>
